server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header Permissions-Policy "serial=(self)" always;

    location /dem/ {
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        resolver_timeout 5s;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host s3.amazonaws.com;
        proxy_pass https://s3.amazonaws.com/elevation-tiles-prod/terrarium/;
    }

    location /meshcore-bridge {
        resolver 127.0.0.11 ipv6=off valid=10s;
        resolver_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        set $meshcore_bridge http://meshcore-bridge:8765;
        proxy_pass $meshcore_bridge;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
