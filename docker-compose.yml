services:
  web:
    container_name: signalmap-lora
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    restart: unless-stopped
    depends_on:
      - meshcore-bridge
    networks:
      - default
      - proxy

  meshcore-bridge:
    container_name: signalmap-meshcore-bridge
    build:
      context: .
      dockerfile: Dockerfile.bridge
    restart: unless-stopped
    expose:
      - "8765"
    networks:
      - default

networks:
  proxy:
    external: true
    name: proxy
